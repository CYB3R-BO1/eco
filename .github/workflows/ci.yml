name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: mypy .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/unit -q --cov=. --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/platform_neo4j
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - env:
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          NEO4J_URI: bolt://localhost:7687
        run: |
          alembic upgrade head
          pytest tests/integration -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: bandit
        run: bandit -r apps core firewall investigation graph orchestration evidence resolution -ll
      - name: pip-audit
        run: pip-audit --strict
      - name: trivy fs
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build prod image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: ai-security-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ai-security-platform:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
      - name: generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ai-security-platform:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - env:
          POSTGRES_HOST: localhost
        run: |
          alembic upgrade head
          python -m infra.scripts.check_migration_drift

  openapi-export:
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -m infra.scripts.export_openapi docs/api/openapi.json
      - name: fail on drift
        run: |
          git diff --exit-code docs/api/openapi.json || (
            echo "::error::OpenAPI export drifted — commit docs/api/openapi.json"
            exit 1
          )
