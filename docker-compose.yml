services:
  api:
    build:
      context: .
      target: dev
    container_name: platform-api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    # Phase 6 WP7 — mount the backup directory so backup-pg / restore-pg
    # Make targets land their dumps somewhere durable on the host.
    # Phase 6 WP8 — container hardening (cap_drop, no-new-privileges,
    # read-only FS with /tmp tmpfs). Distroless intentionally NOT used —
    # operators need /bin/bash for runbook entrypoints.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    # NOTE: read_only:true is desirable in prod but conflicts with the
    # bind-mounted volume:./:/app used for dev hot-reload. Enable it in
    # the prod overlay (docker-compose.prod.yml) — see WP8 docs.

  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    # Phase 6 WP7 — periodic RDB snapshots. The three triplets mean: dump
    # if 1 key changes in 900s, 10 in 300s, or 10000 in 60s. Combined
    # with appendonly=no this gives a low-cost RPO of ~15 minutes that
    # matches the runbook target.
    command:
      - redis-server
      - --save
      - "900 1 300 10 60 10000"
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.20-community
    container_name: platform-neo4j
    environment:
      NEO4J_AUTH: neo4j/platform_neo4j
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
