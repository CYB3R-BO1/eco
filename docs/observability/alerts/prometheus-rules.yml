# Phase 6 WP11 — Prometheus alert rules.
#
# Import into Prometheus with a matching `rule_files:` entry. Each alert
# maps to a runbook under docs/runbooks/.
groups:
  - name: ai-security-platform-phase6
    interval: 30s
    rules:
      - alert: HighHttp5xxRate
        expr: |
          sum by (route) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (route) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: ">5% 5xx on {{ $labels.route }}"
          runbook: docs/runbooks/incident-response.md

      - alert: CircuitBreakerOpen
        expr: max by (agent_name) (ai_security_circuit_breaker_state) == 2
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "circuit breaker open: {{ $labels.agent_name }}"
          runbook: docs/runbooks/circuit-breaker-tripped.md

      - alert: DLQDepthGrowing
        expr: |
          (ai_security_dlq_depth - ai_security_dlq_depth offset 30m) > 50
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "DLQ {{ $labels.queue_name }} grew by >50 in 30m"
          runbook: docs/runbooks/dlq-drain.md

      - alert: RetentionJobFailed
        expr: increase(ai_security_retention_job_runs_total{outcome="error"}[1d]) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "retention job {{ $labels.job }} reported error in last 24h"
          runbook: docs/runbooks/retention-job-failed.md

      - alert: AuthDenialBurst
        expr: |
          sum(rate(auth_denials_total{reason!="expired"}[5m])) > 10
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "structured auth denials surging (excl. expired)"
          runbook: docs/runbooks/incident-response.md

      - alert: SlowQuerySpike
        expr: |
          increase({__name__="ai_security_http_request_duration_seconds_bucket",le="+Inf"}[5m]) > 0
          and
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "p95 latency > 2s — check db.slow_query logs"
          runbook: docs/runbooks/incident-response.md
